name: testRigor Mobile

# Builds the app on EAS for each new version and routes each artifact to the
# matching testRigor suite: the APK goes to the Android suite, the simulator
# .app.zip goes to the iOS suite.
#
# Required repository secrets:
#   EXPO_TOKEN                - Expo access token (expo.dev > Account > Access tokens)
#   TESTRIGOR_API_KEY         - testRigor personal auth token (avoids the interactive prompt)
#   TR_ANDROID_SUITE_TOKEN    - CI token of the Android suite (suite > CI/CD Integration)
#   TR_IOS_SUITE_TOKEN        - CI token of the iOS suite (suite > CI/CD Integration)
#
# The target suites are set below. Override them with the repository variables
# TR_ANDROID_SUITE_ID / TR_IOS_SUITE_ID to point a fork or a branch elsewhere.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      labels:
        description: "testRigor labels to run (empty = whole suite)"
        required: false
        default: ""

env:
  # https://app.testrigor.com/test-suites/LYyRBuv9ZhHhANPnZ/test-cases
  TR_ANDROID_SUITE_ID: ${{ vars.TR_ANDROID_SUITE_ID || 'LYyRBuv9ZhHhANPnZ' }}
  # https://app.testrigor.com/test-suites/o69JjqqA6vmP3Ndpj/test-cases
  TR_IOS_SUITE_ID: ${{ vars.TR_IOS_SUITE_ID || 'o69JjqqA6vmP3Ndpj' }}
  # Runs the whole suite by default. Pass labels on the manual trigger to narrow it.
  TR_LABELS: ${{ github.event.inputs.labels || '' }}

jobs:
  android:
    name: Android suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install EAS and testRigor CLIs
        run: npm install -g eas-cli @testrigor/testrigor-cli

      - name: Build the APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview \
            --non-interactive --wait --json > build.json
          url=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' build.json)
          echo "Downloading $url"
          curl -fL "$url" -o app.apk
          ls -lh app.apk

      - name: Generate the version test data
        env:
          TR_PLATFORM: android
        run: node scripts/testrigor-vars.js testrigor-vars.json

      - name: Run the testRigor Android suite
        env:
          TESTRIGOR_API_KEY: ${{ secrets.TESTRIGOR_API_KEY }}
        run: |
          testrigor test-suite run "$TR_ANDROID_SUITE_ID" \
            --token "${{ secrets.TR_ANDROID_SUITE_TOKEN }}" \
            --file-path app.apk \
            --variables-path testrigor-vars.json \
            ${TR_LABELS:+--labels "$TR_LABELS"} \
            --junit-report-save-path testrigor-android.xml

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testrigor-android
          path: testrigor-android.xml
          if-no-files-found: warn

  ios:
    name: iOS suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install EAS and testRigor CLIs
        run: npm install -g eas-cli @testrigor/testrigor-cli

      - name: Build the simulator app on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform ios --profile preview \
            --non-interactive --wait --json > build.json
          url=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' build.json)
          echo "Downloading $url"
          curl -fL "$url" -o sim-build.tar.gz

      - name: Repackage the .app bundle as .app.zip
        run: |
          mkdir extracted
          tar -xzf sim-build.tar.gz -C extracted
          app=$(find extracted -maxdepth 2 -name "*.app" | head -1)
          if [ -z "$app" ]; then
            echo "No .app bundle found in the EAS artifact"
            exit 1
          fi
          # testRigor validates the extension, so the name must end in .app.zip.
          # -y keeps the symlinks inside the bundle; without it the app fails to launch.
          (cd "$(dirname "$app")" && zip -qry -X "$GITHUB_WORKSPACE/trplayground.app.zip" "$(basename "$app")")
          ls -lh trplayground.app.zip

      - name: Generate the version test data
        env:
          TR_PLATFORM: ios
        run: node scripts/testrigor-vars.js testrigor-vars.json

      - name: Run the testRigor iOS suite
        env:
          TESTRIGOR_API_KEY: ${{ secrets.TESTRIGOR_API_KEY }}
        run: |
          testrigor test-suite run "$TR_IOS_SUITE_ID" \
            --token "${{ secrets.TR_IOS_SUITE_TOKEN }}" \
            --file-path trplayground.app.zip \
            --variables-path testrigor-vars.json \
            ${TR_LABELS:+--labels "$TR_LABELS"} \
            --junit-report-save-path testrigor-ios.xml

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testrigor-ios
          path: testrigor-ios.xml
          if-no-files-found: warn
